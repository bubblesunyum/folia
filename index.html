<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta
      name="description"
      content="Portfolio Town: a solarpunk-town portfolio site, starting with the Cortico neighborhood."
    />
    <title>Portfolio Town</title>
  </head>
  <body>
    <!-- Prerendered `/` shell (spike 6): the same markup `SkyShell` renders,
         so crawlers and first paint get route content before the canvas chunk
         arrives. React Router v8 prerender generates this in Phase 1. -->
    <div id="root">
      <div class="sky-shell">
        <div class="sky-shell-gradient" aria-hidden="true"></div>
        <main class="sky-shell-content">
          <h1>portfolio town</h1>
          <p>a solarpunk town portfolio, starting with cortico</p>
        </main>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
